<!DOCTYPE html>
<html>
<head>
    <title>Add Admin</title>
    <style>
        body {
            font-family: Arial;
            background: #1e3c72;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        input {
            border: 1px solid #ccc;
        }
        button {
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1e7e34;
        }
        .msg {
            color: green;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2 style="text-align:center;">Create Admin</h2>

    <!-- Flash Message -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="msg">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('add_admin') }}">
        <input type="text" name="name" placeholder="Admin Name" required>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Admin</button>
   <!-- <a href="{{ url_for('login') }}">
        <button style="background:#2a5298;">Back To Login</button>
        </a>-->
    </form>
</div>
</body>
</html>
